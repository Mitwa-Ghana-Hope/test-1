name: share pattern test
on:
  workflow_dispatch:
    inputs:
      pieces:
        required: true
      real:
        required: true
      parallel:
        default: "60"
jobs:
  share:
    name: Wait for the plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.share.outputs.matrix }}
      count: ${{ steps.share.outputs.count }}
    steps:
      - name: Which of my pieces exist
        id: share
        env:
          PIECES: ${{ inputs.pieces }}
          REAL: ${{ inputs.real }}
        run: |
          python3 -c "
          import json, os
          mine = json.loads(os.environ['PIECES']); n = int(os.environ['REAL'])
          own = [k for k in mine if k < n]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('matrix=' + json.dumps(own) + '\n'); f.write('count=' + str(len(own)) + '\n')
          print('keeps', own)
          "
  encode:
    name: Piece ${{ matrix.chunk }}
    needs: share
    if: needs.share.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.parallel) }}
      matrix:
        chunk: ${{ fromJSON(needs.share.outputs.matrix) }}
    steps:
      - run: echo "piece ${{ matrix.chunk }}"
